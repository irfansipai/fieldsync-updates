name: Deploy Pages

# Serves the OTA manifest + bundles for the FieldSync Capacitor app. Every push
# to main deploys the whole repo to GitHub Pages; tools/publish-ota.mjs (run from
# the fieldsync-frontend repo) writes manifest.json + bundles/*.zip here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
